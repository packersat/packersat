<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule a Session — Packer SAT Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:   #f4ecd9;
      --ivory:   #fffdf7;
      --ink:     #1a1715;
      --ink-2:   #4a423a;
      --ink-3:   #6b6258;
      --rule:    rgba(26,23,21,0.12);
      --crimson: #a31621;
      --gold:    #c8a96e;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
    }

    /* ── Brand bar ── */
    .brand-bar {
      text-align: center;
      margin-bottom: 2rem;
    }
    .seal {
      width: 40px; height: 40px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--crimson);
      margin-bottom: 10px;
    }
    .wordmark {
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      color: var(--ink);
      display: block;
      letter-spacing: -0.01em;
    }
    .wordmark .dot { color: var(--crimson); }

    /* ── Card ── */
    .card {
      background: var(--ivory);
      border: 1px solid var(--rule);
      max-width: 520px;
      width: 100%;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 40px rgba(26,23,21,0.08);
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 0.6rem;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    h1 em { font-style: italic; color: var(--crimson); }

    .sub {
      color: var(--ink-3);
      font-size: 0.88rem;
      line-height: 1.65;
      margin-bottom: 1.8rem;
      font-family: 'Inter', sans-serif;
    }

    /* ── Slot picker ── */
    .slots-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.75rem;
      display: block;
    }

    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.6rem;
    }

    .slot-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.2rem;
      background: var(--ivory);
      border: 1.5px solid var(--rule);
      cursor: pointer;
      text-align: left;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .slot-btn:hover {
      border-color: var(--crimson);
      background: rgba(163,22,33,0.04);
    }
    .slot-btn.selected {
      border-color: var(--crimson);
      background: rgba(163,22,33,0.07);
    }
    .slot-btn .slot-day {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      display: block;
      margin-bottom: 0.2rem;
    }
    .slot-btn .slot-time {
      font-size: 0.88rem;
      color: var(--crimson);
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    .slot-btn .slot-loc {
      font-size: 0.78rem;
      color: var(--ink-3);
      margin-top: 0.2rem;
    }
    .slot-btn .check {
      width: 22px; height: 22px;
      border: 1.5px solid var(--rule);
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .slot-btn.selected .check {
      background: var(--crimson);
      border-color: var(--crimson);
    }
    .slot-btn .check svg { display: none; }
    .slot-btn.selected .check svg { display: block; }

    .slot-btn.taken {
      cursor: default;
      pointer-events: none;
      background: rgba(26,23,21,0.03);
      overflow: hidden;
    }
    .slot-btn.taken::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(135deg, transparent, transparent 7px, rgba(26,23,21,0.035) 7px, rgba(26,23,21,0.035) 8px);
      pointer-events: none;
    }
    .slot-btn.taken .taken-label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(163,22,33,0.55);
      margin-bottom: 0.25rem;
    }
    .slot-btn.taken .slot-day { text-decoration: line-through; color: var(--ink-3); }
    .slot-btn.taken .slot-time { color: var(--ink-3); }

    /* ── Buttons ── */
    .btn-confirm {
      width: 100%;
      background: var(--ink);
      color: var(--ivory);
      border: 1.5px solid var(--ink);
      padding: 0.9rem 1.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 0.8rem;
      letter-spacing: 0.01em;
    }
    .btn-confirm:hover:not(:disabled) { background: var(--crimson); border-color: var(--crimson); }
    .btn-confirm:disabled { opacity: 0.4; cursor: default; }

    .btn-ghost {
      width: 100%;
      background: transparent;
      color: var(--ink-2);
      border: 1px solid var(--rule);
      padding: 0.75rem 1.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-ghost:hover { border-color: var(--ink); color: var(--ink); }

    /* ── Status / note ── */
    .note-box {
      background: rgba(163,22,33,0.05);
      border-left: 3px solid var(--crimson);
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--ink-2);
    }

    .status { font-size: 0.85rem; line-height: 1.6; min-height: 1.4rem; color: var(--ink-3); text-align: center; }
    .status.error   { color: var(--crimson); }
    .status.success { color: #1a6e3a; }

    /* ── Success ── */
    .success-wrap { text-align: center; padding: 0.5rem 0; }
    .success-icon {
      width: 52px; height: 52px;
      background: rgba(163,22,33,0.08);
      border: 1.5px solid var(--rule);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem;
    }
    .cal-link {
      display: inline-block;
      margin-top: 1.2rem;
      background: rgba(200,169,110,0.1);
      border: 1px solid rgba(200,169,110,0.35);
      color: #9a7b1f;
      border-radius: 0;
      padding: 0.55rem 1.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 10px;
    }
    .cal-link:hover { background: rgba(200,169,110,0.18); }

    /* ── Single slot view ── */
    .slot-card {
      border: 1px solid var(--rule);
      padding: 1.2rem 1.4rem;
      background: var(--paper);
      margin-bottom: 1.5rem;
    }
    .slot-card .slot-day  { font-size: 1rem; font-weight: 600; color: var(--ink); margin-bottom: 0.3rem; }
    .slot-card .slot-time { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: var(--crimson); text-transform: uppercase; }
    .slot-card .slot-loc  { font-size: 0.78rem; color: var(--ink-3); margin-top: 0.35rem; }

    /* ── Request time form ── */
    .field-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.4rem;
      display: block;
    }
    .field-wrap { margin-bottom: 1rem; }
    input[type="date"], input[type="time"] {
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--rule);
      padding: 0.7rem 1rem;
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="date"]:focus, input[type="time"]:focus {
      border-color: var(--crimson);
    }

    .loading {
      text-align: center;
      color: var(--ink-3);
      font-size: 0.9rem;
      padding: 2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 1.5rem 0;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.4rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="brand-bar">
  <div class="seal">P</div>
  <span class="wordmark">Packer<span class="dot">·</span>SAT</span>
</div>

<div class="card">
  <div id="main-content">
    <div class="loading">Loading session details…</div>
  </div>
</div>

<script type="module">
  import { initializeApp }   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, doc, getDoc, updateDoc, addDoc, collection }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const app = initializeApp({
    apiKey:            "AIzaSyAgl3-vGO-FAHSodXvTFtWv7V5_48qW22w",
    authDomain:        "packer-sat.firebaseapp.com",
    projectId:         "packer-sat",
    storageBucket:     "packer-sat.firebasestorage.app",
    messagingSenderId: "442480334688",
    appId:             "1:442480334688:web:9c22966209985694bb7005",
  });
  const db = getFirestore(app);
  const content = document.getElementById('main-content');

  // ── Helpers ──────────────────────────────────────────────────────
  function formatDay(date) {
    return new Date(date + 'T12:00:00').toLocaleDateString('en-US',
      { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }
  function formatTime(time) {
    if (!time) return 'TBD';
    const [h, m] = time.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  function buildCalLink(date, time, studentName, location) {
    const [yr, mo, dy] = date.split('-').map(Number);
    const [h, m]       = time.split(':').map(Number);
    const d   = new Date(yr, mo - 1, dy);
    const jan = new Date(yr, 0, 1), jul = new Date(yr, 6, 1);
    const isDST  = d.getTimezoneOffset() < Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
    const offset = isDST ? 4 : 5;
    const startUTC = new Date(Date.UTC(yr, mo - 1, dy, h + offset, m, 0));
    const endUTC   = new Date(startUTC.getTime() + 3600000);
    const fmt = dt => dt.toISOString().replace(/[-:]/g,'').replace('.000','');
    const title   = encodeURIComponent(`Jack / ${studentName || 'Student'} — SAT Tutoring`);
    const details = encodeURIComponent('SAT tutoring session at Packer Collegiate Institute.');
    const loc     = encodeURIComponent(location || 'Packer Collegiate Institute, Brooklyn, NY');
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${fmt(startUTC)}/${fmt(endUTC)}&details=${details}&location=${loc}`;
  }

  // ── Email senders ─────────────────────────────────────────────────
  async function sendConfirmationEmail(toEmail, toName, date, time, location, calLink) {
    if (!toEmail) return;
    const dayStr  = formatDay(date);
    const timeStr = formatTime(time);
    const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"></head>'
      + '<body style="margin:0;padding:0;background:#f4ecd9;font-family:\'Inter\',Arial,sans-serif">'
      + '<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4ecd9;padding:40px 20px">'
      + '<tr><td align="center"><table width="560" style="max-width:560px;width:100%">'
      + '<tr><td style="background:#1a1715;padding:28px 36px;text-align:center">'
      + '<div style="font-family:Georgia,serif;font-size:22px;color:#fffdf7;font-style:italic">Packer<span style="color:#a31621">·</span>SAT</div>'
      + '<div style="font-size:10px;color:rgba(255,253,247,0.5);letter-spacing:0.18em;text-transform:uppercase;margin-top:6px">Session Confirmed</div>'
      + '</td></tr>'
      + '<tr><td style="background:#fffdf7;padding:32px 36px;border:1px solid rgba(26,23,21,0.1);border-top:none">'
      + '<p style="margin:0 0 12px;color:#1a1715;font-size:15px;line-height:1.6">Hi <strong>' + toName + '</strong>,</p>'
      + '<p style="margin:0 0 24px;color:#6b6258;font-size:14px;line-height:1.75">Your SAT tutoring session is confirmed. See you then.</p>'
      + '<table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px">'
      + '<tr><td style="padding:12px 16px;background:#f4ecd9;border-bottom:1px solid rgba(26,23,21,0.08)">'
      + '<div style="font-size:10px;color:#6b6258;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:3px">Date</div>'
      + '<div style="font-size:15px;color:#1a1715;font-weight:600">' + dayStr + '</div>'
      + '</td></tr>'
      + '<tr><td style="padding:12px 16px;background:#fffdf7;border-bottom:1px solid rgba(26,23,21,0.08)">'
      + '<div style="font-size:10px;color:#6b6258;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:3px">Time</div>'
      + '<div style="font-size:15px;color:#a31621;font-weight:600">' + timeStr + ' Eastern</div>'
      + '</td></tr>'
      + '<tr><td style="padding:12px 16px;background:#f4ecd9">'
      + '<div style="font-size:10px;color:#6b6258;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:3px">Location</div>'
      + '<div style="font-size:15px;color:#1a1715;font-weight:600">' + (location || 'Packer Collegiate Institute') + '</div>'
      + '</td></tr></table>'
      + '<a href="' + calLink + '" style="display:inline-block;background:#1a1715;color:#fffdf7;text-decoration:none;padding:10px 22px;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;font-family:Arial,sans-serif">+ Add to Calendar</a>'
      + '</td></tr>'
      + '<tr><td style="background:#f4ecd9;padding:16px 36px;border:1px solid rgba(26,23,21,0.1);border-top:none;text-align:center">'
      + '<p style="margin:0;color:#8a8278;font-size:11px">Questions? Reply to this email &middot; packersat.org</p>'
      + '</td></tr></table></td></tr></table></body></html>';

    await fetch('https://packersat.vercel.app/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        to_email: toEmail, to_name: toName,
        subject:  `Session confirmed: ${dayStr} at ${timeStr}`,
        html_content: html,
        from_email: 'jack@packersat.org',
        from_name:  'Jack Rose',
        reply_to:   'jack@packersat.org',
      }),
    });
  }

  async function sendRequestEmail(studentName, studentEmail, requestedDate, requestedTime, location) {
    const dayStr  = formatDay(requestedDate);
    const timeStr = formatTime(requestedTime);
    const html = '<!DOCTYPE html><html><body style="background:#f4ecd9;font-family:Inter,Arial,sans-serif;padding:40px 20px">'
      + '<div style="max-width:520px;margin:0 auto;background:#fffdf7;border:1px solid rgba(26,23,21,0.1);padding:32px">'
      + '<h2 style="font-family:Georgia,serif;font-size:20px;color:#1a1715;margin:0 0 16px">Session Time Request</h2>'
      + '<p style="color:#4a423a;font-size:14px;line-height:1.7;margin:0 0 20px"><strong>' + studentName + '</strong> ('+ studentEmail +') couldn\'t make any of the offered times and has requested:</p>'
      + '<div style="background:#f4ecd9;border-left:3px solid #a31621;padding:14px 18px;margin-bottom:20px">'
      + '<div style="font-size:10px;color:#6b6258;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:3px">Date</div>'
      + '<div style="font-size:16px;font-weight:600;color:#1a1715;margin-bottom:10px">' + dayStr + '</div>'
      + '<div style="font-size:10px;color:#6b6258;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:3px">Time</div>'
      + '<div style="font-size:16px;font-weight:600;color:#a31621">' + timeStr + ' Eastern</div>'
      + '</div>'
      + '<p style="color:#6b6258;font-size:13px;line-height:1.6;margin:0">Confirm by scheduling in the portal or send a new picker.</p>'
      + '</div></body></html>';

    await fetch('https://packersat.vercel.app/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        to_email: 'jackroseblue@gmail.com', to_name: 'Jack Rose',
        subject:  studentName + ' requested a new session time — ' + dayStr + ' at ' + timeStr,
        html_content: html,
        from_email: 'noreply@packersat.org',
        from_name:  'Packer SAT Tutoring',
        reply_to:   studentEmail,
      }),
    });
  }

  // ── Show success ──────────────────────────────────────────────────
  function showSuccess(date, time, location, studentName, studentEmail, calLink) {
    const dayStr  = formatDay(date);
    const timeStr = formatTime(time);
    content.innerHTML = `
      <div class="success-wrap">
        <div class="success-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a31621" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="eyebrow">Confirmed</div>
        <h1>You're all set.</h1>
        <p class="sub" style="margin-top:0.5rem">
          Your session on <strong style="color:var(--ink)">${dayStr}</strong>
          at <strong style="color:var(--crimson)">${timeStr} Eastern</strong> is confirmed.
          ${studentEmail ? 'A confirmation email is on its way.' : ''}
        </p>
        <hr class="divider">
        <a href="${calLink}" target="_blank" class="cal-link">+ Add to Google Calendar</a>
      </div>`;
  }

  // ── URL params ────────────────────────────────────────────────────
  const params   = new URLSearchParams(window.location.search);
  const pickerId = params.get('p');   // multi-slot picker link
  const tokenRaw = params.get('t');   // legacy single-slot token
  const mode     = params.get('mode');

  // ══════════════════════════════════════════════════════════════════
  //  MODE 1: Multi-slot picker  (?p=<pickerId>, no mode param)
  // ══════════════════════════════════════════════════════════════════
  if (pickerId && mode !== 'request') {
    let selectedIdx = null;

    (async () => {
      try {
        const pickerSnap = await getDoc(doc(db, 'schedulePickers', pickerId));
        if (!pickerSnap.exists()) {
          content.innerHTML = `<div class="eyebrow">Scheduling</div><h1>Link expired</h1><p class="sub">This scheduling link is no longer valid. Contact your tutor for a new one.</p>`;
          return;
        }
        const picker = pickerSnap.data();
        const slots  = picker.slots || [];
        const loc    = picker.location || 'Packer Collegiate Institute';
        const note   = picker.note || '';
        const studentName  = picker.studentName  || '';
        const studentEmail = picker.studentEmail || '';
        const studentId    = picker.studentId    || null;

        if (!slots.length) {
          content.innerHTML = `<div class="eyebrow">Scheduling</div><h1>No times available</h1><p class="sub">There are no time slots on this link. Contact your tutor.</p>`;
          return;
        }

        // Cross-check the real sessions collection — a date+time may already be
        // booked (through a different picker link, an emailed link, or booked
        // directly by the admin) with no relation to this picker doc's own
        // slotUsed_* flags. confirm.html runs unauthenticated, so it can't read
        // `sessions` directly (Firestore rules rightly keep that private) —
        // this asks a server endpoint instead, which only ever hands back
        // taken date|time keys, never session/student details.
        const crossBookedSet = new Set(); // "date|time"
        if (picker.adminId) {
          try {
            const availRes = await fetch('/api/check-taken-slots', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                tutorId: picker.adminId,
                slots: slots.map(s => ({ date: s.date, time: s.time })),
              }),
            });
            const availData = await availRes.json();
            (availData.taken || []).forEach(key => crossBookedSet.add(key));
          } catch(e) { console.warn('Could not check existing bookings:', e); }
        }

        // Render picker UI
        function render() {
          const slotItems = slots.map((s, i) => {
            const used = picker[`slotUsed_${i}`] || crossBookedSet.has(`${s.date}|${s.time}`);
            const sel  = selectedIdx === i;
            if (used) return `
              <div class="slot-btn taken">
                <div>
                  <span class="taken-label">Already taken</span>
                  <span class="slot-day">${formatDay(s.date)}</span>
                  <span class="slot-time">${formatTime(s.time)} Eastern</span>
                </div>
              </div>`;
            return `

    // ── Dial + day rail JS ──────────────────────────────────────────
    (function initRequestTime() {
      var NS = 'http://www.w3.org/2000/svg';
      var CX = 124, CY = 124, R = 96, HR = 13;
      var state = { dateISO: null, hour: 3, min: 30, mer: 'PM' };
      var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      function isoOf(d) {
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      }
      function fmtTime() {
        return state.hour + ':' + String(state.min).padStart(2,'0') + ' ' + state.mer;
      }
      function fmtDayLong() {
        var d = new Date(state.dateISO + 'T12:00:00');
        return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
      }

      // ── day rail ──
      var rail  = document.getElementById('rt-rail');
      var today = new Date(); today.setHours(12,0,0,0);
      var days  = [];
      for (var i = 1; i <= 14; i++) {
        var d = new Date(today); d.setDate(today.getDate() + i); days.push(d);
      }
      days.forEach(function(d, k) {
        var el = document.createElement('div');
        el.className = 'rt-day';
        el.style.animationDelay = (0.03 * k) + 's';
        el.innerHTML = '<div class="rt-dow">' + DOW[d.getDay()] + '</div><div class="rt-num">' + d.getDate() + '</div><div class="rt-mon">' + MON[d.getMonth()] + '</div>';
        el.addEventListener('click', function() {
          rail.querySelectorAll('.rt-day').forEach(function(n) { n.classList.remove('sel'); });
          el.classList.add('sel');
          state.dateISO = isoOf(d);
          updateRead();
        });
        if (k === 0) { el.classList.add('sel'); state.dateISO = isoOf(d); }
        rail.appendChild(el);
      });

      // ── build SVG dial ──
      function P(tag, attrs) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      }
      function hourPos(h, radius) {
        var ang = (h % 12) * 30 - 90;
        var rad = ang * Math.PI / 180;
        return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
      }
      function arcPath(toH) {
        var start = hourPos(12, R);
        var end   = hourPos(toH, R);
        var ang   = (toH % 12) * 30;
        var large = ang > 180 ? 1 : 0;
        if (toH % 12 === 0) return '';
        return 'M ' + start.x + ' ' + start.y + ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + end.x + ' ' + end.y;
      }

      var svg = document.getElementById('rt-svg');
      // gradient
      var defs = P('defs', {});
      var grad = P('linearGradient', { id:'rtg', x1:'0', y1:'0', x2:'1', y2:'1' });
      grad.appendChild(P('stop', { offset:'0', 'stop-color':'#a31621' }));
      grad.appendChild(P('stop', { offset:'1', 'stop-color':'#c8a96e' }));
      defs.appendChild(grad); svg.appendChild(defs);
      // base ring
      svg.appendChild(P('circle', { cx:CX, cy:CY, r:R, fill:'none', stroke:'rgba(26,23,21,0.12)', 'stroke-width':1.5 }));
      // arc
      var arc = P('path', { fill:'none', stroke:'url(#rtg)', 'stroke-width':3.5, 'stroke-linecap':'round' });
      svg.appendChild(arc);
      // ticks + labels
      var lbls = {};
      for (var h = 1; h <= 12; h++) {
        var tp = hourPos(h, R);
        svg.appendChild(P('circle', { cx:tp.x, cy:tp.y, r:1.5, fill:'rgba(26,23,21,0.2)' }));
        var lp = hourPos(h, R - 20);
        var t  = P('text', { x:lp.x, y:lp.y, 'text-anchor':'middle', 'dominant-baseline':'central', 'class':'rt-tick' });
        t.textContent = h; svg.appendChild(t); lbls[h] = t;
      }
      // handle
      var hg = P('g', { 'class':'rt-hgrp' });
      hg.appendChild(P('circle', { r:HR+6, fill:'rgba(163,22,33,0.12)' }));
      hg.appendChild(P('circle', { r:HR, fill:'#a31621', stroke:'#fffdf7', 'stroke-width':2.2 }));
      hg.appendChild(P('circle', { r:3, fill:'#fffdf7' }));
      svg.appendChild(hg);

      function render() {
        var pos = hourPos(state.hour, R);
        hg.setAttribute('transform', 'translate(' + pos.x + ',' + pos.y + ')');
        arc.setAttribute('d', arcPath(state.hour));
        for (var h = 1; h <= 12; h++) { lbls[h].classList.toggle('on', h === state.hour); }
        updateRead();
      }
      function updateRead() {
        var mm = String(state.min).padStart(2, '0');
        document.getElementById('rt-big').innerHTML = state.hour + ':' + mm + '<span class="rt-mer-sup" id="rt-mer">' + state.mer + '</span>';
        if (state.dateISO) {
          var d = new Date(state.dateISO + 'T12:00:00');
          document.getElementById('rt-readday').textContent = DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate();
        }
      }

      // ── drag ──
      var dialEl  = document.getElementById('rt-dial');
      var dragging = false;
      function angleToHour(cx, cy) {
        var rect = svg.getBoundingClientRect();
        var sx = (cx - rect.left) / rect.width * 248;
        var sy = (cy - rect.top)  / rect.height * 248;
        var ang = Math.atan2(sy - CY, sx - CX) * 180 / Math.PI + 90;
        if (ang < 0) ang += 360;
        var h = Math.round(ang / 30); if (h === 0) h = 12;
        return h;
      }
      function fromPointer(e) {
        var pt = e.touches ? e.touches[0] : e;
        state.hour = angleToHour(pt.clientX, pt.clientY);
        render();
      }
      dialEl.addEventListener('pointerdown', function(e) { dragging = true; dialEl.classList.add('drag'); fromPointer(e); e.preventDefault(); });
      window.addEventListener('pointermove',  function(e) { if (dragging) { fromPointer(e); e.preventDefault(); } });
      window.addEventListener('pointerup',    function()  { dragging = false; dialEl.classList.remove('drag'); });

      // ── AM/PM ──
      document.getElementById('rt-ampm').addEventListener('click', function(e) {
        var b = e.target.closest('button'); if (!b) return;
        this.querySelectorAll('button').forEach(function(n) { n.classList.remove('on'); });
        b.classList.add('on'); state.mer = b.dataset.mer; updateRead();
      });
      // ── minutes ──
      document.getElementById('rt-mins').addEventListener('click', function(e) {
        var b = e.target.closest('button'); if (!b) return;
        this.querySelectorAll('button').forEach(function(n) { n.classList.remove('on'); });
        b.classList.add('on'); state.min = parseInt(b.dataset.min, 10); updateRead();

      // ── submit ──
      document.getElementById('rt-sendbtn').addEventListener('click', async function() {
        var btn    = document.getElementById('rt-sendbtn');
        var status = document.getElementById('rt-status');
        if (btn.classList.contains('sending')) return;

        btn.querySelector('.rt-lbl').textContent = 'Sending…';
        try {
          var dayLong  = fmtDayLong();
          var timeStr  = fmtTime();
          var html = '<!DOCTYPE html><html><body style="background:#f4ecd9;font-family:Inter,Arial,sans-serif;padding:40px 20px">'
            + '<div style="max-width:520px;margin:0 auto;background:#fffdf7;border:1px solid rgba(26,23,21,0.1);padding:32px">'
            + '<h2 style="font-family:Georgia,serif;font-size:20px;color:#1a1715;margin:0 0 16px">Session Time Request</h2>'
            + '<p style="color:#4a423a;font-size:14px;line-height:1.7;margin:0 0 20px">'
            + (studentName ? '<strong>' + studentName + '</strong>' + (studentEmail ? ' (' + studentEmail + ')' : '') : 'Someone')
            + ' has requested a session time:</p>'
            + '<div style="background:#f4ecd9;border-left:3px solid #a31621;padding:14px 18px;margin-bottom:20px">'
            + '<div style="font-size:10px;color:#6b6258;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:4px">Date</div>'
            + '<div style="font-size:18px;font-weight:600;color:#1a1715;margin-bottom:10px">' + dayLong + '</div>'
            + '<div style="font-size:10px;color:#6b6258;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:4px">Time</div>'
            + '<div style="font-size:18px;font-weight:600;color:#a31621">' + timeStr + ' Eastern</div>'
            + '</div>'
            + '<p style="color:#6b6258;font-size:13px;line-height:1.6;margin:0">Reply to confirm or send a new picker.</p>'
            + '</div></body></html>';

          await fetch('https://packersat.vercel.app/api/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              to_email:     'jackroseblue@gmail.com',
              to_name:      'Jack Rose',
              subject:      (studentName || 'Student') + ' requested: ' + dayLong + ' at ' + timeStr,
              html_content: html,
              from_email:   'noreply@packersat.org',
              from_name:    'Packer SAT Tutoring',
              reply_to:     studentEmail || 'noreply@packersat.org',
            }),
          });

          // success screen
          document.getElementById('rt-stage').innerHTML =
            '<div class="rt-success">'
            + '<div class="rt-checkring"><svg viewBox="0 0 80 80">'
            + '<circle class="rt-cc" cx="40" cy="40" r="36"/>'
            + '<path class="rt-ck" d="M26 41 L36 51 L55 30"/>'
            + '</svg></div>'
            + '<span class="rt-eyebrow" style="justify-content:center;margin-bottom:0.5rem">Request sent</span>'
            + '<div class="rt-h1" style="margin-bottom:0.5rem">We\u2019re <em>on it.</em></div>'
            + '<p class="rt-sub">Your preferred time has been sent. You\u2019ll hear back shortly to lock it in.</p>'
            + '<div class="rt-reqchip"><span class="rc-day">' + dayLong + '</span><span class="rc-time">' + timeStr + ' Eastern</span></div>'
            + '</div>';

        } catch(e) {
          btn.classList.remove('sending');
          btn.querySelector('.rt-lbl').innerHTML = 'Send request <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
          if (status) { status.textContent = 'Something went wrong: ' + (e?.message || String(e)); status.className = 'status error'; }
        }
      });

      render();
    })();

  // ══════════════════════════════════════════════════════════════════
  //  MODE 3: Legacy single-slot token  (?t=<base64>)
  // ══════════════════════════════════════════════════════════════════
  } else if (tokenRaw) {
    let token = null;
    try {
      const b64    = tokenRaw.replace(/-/g, '+').replace(/_/g, '/');
      const padded = b64 + '=='.slice(0, (4 - b64.length % 4) % 4);
      token = JSON.parse(atob(padded));
    } catch(e) { /* bad token */ }

    if (!token?.pickerId || !token?.date || !token?.time) {
      content.innerHTML = `<div class="eyebrow">Error</div><h1>Invalid link</h1><p class="sub">This scheduling link is invalid or has expired. Contact your tutor for a new one.</p>`;
    } else {
      const { pickerId: pid, studentId, date, time, location: loc, idx } = token;
      const studentName  = token.studentName  || '';
      const studentEmail = token.studentEmail || '';
      const dayStr  = formatDay(date);
      const timeStr = formatTime(time);

      content.innerHTML = `
        <div class="eyebrow">Confirm your session</div>
        <h1>This <em>work for you?</em></h1>
        <p class="sub">You're confirming the following SAT tutoring session:</p>
        <div class="slot-card">
          <div class="slot-day">${dayStr}</div>
          <div class="slot-time">${timeStr} Eastern</div>
          <div class="slot-loc">📍 ${loc || 'Packer Collegiate Institute'}</div>
        </div>
        <button class="btn-confirm" id="confirm-btn" onclick="confirmSingle()">Confirm this time</button>
        <div class="status" id="status-msg"></div>
        <hr class="divider">
        <a href="?t=${tokenRaw}&mode=request" class="btn-ghost" style="font-size:0.82rem;color:var(--ink-3)">
          This time doesn't work → Request a different time
        </a>`;

      window.confirmSingle = async function() {
        const btn    = document.getElementById('confirm-btn');
        const status = document.getElementById('status-msg');
        btn.disabled = true; btn.textContent = 'Confirming…';
        try {
          const pickerDoc = await getDoc(doc(db, 'schedulePickers', pid));
          const picker    = pickerDoc.exists() ? pickerDoc.data() : {};
          const resolvedName  = studentName  || picker.studentName  || 'Student';
          const resolvedEmail = studentEmail || picker.studentEmail || '';
          const resolvedId    = studentId    || picker.studentId    || null;
          const tutorId       = picker.adminId || null;

          await addDoc(collection(db, 'sessions'), {
            studentId: resolvedId, tutorId, date, time,
            location: loc || 'Packer Collegiate Institute',
            createdAt: new Date().toISOString(),
            confirmedByStudent: true, pickerId: pid,
          });

          if (pid && idx !== undefined) {
            await updateDoc(doc(db, 'schedulePickers', pid), { [`slotUsed_${idx}`]: true });
          }

          const calLink = buildCalLink(date, time, resolvedName, loc);
          try {
            if (resolvedEmail) await sendConfirmationEmail(resolvedEmail, resolvedName, date, time, loc, calLink);
          } catch(e) { console.warn('Email failed:', e); }

          showSuccess(date, time, loc, resolvedName, resolvedEmail, calLink);
        } catch(e) {
          console.error(e);
          btn.disabled = false; btn.textContent = 'Confirm this time';
          if (status) { status.textContent = 'Error: ' + (e?.message || String(e)); status.className = 'status error'; }
        }
      };
    }

  // ══════════════════════════════════════════════════════════════════
  //  No valid params
  // ══════════════════════════════════════════════════════════════════
  } else {
    content.innerHTML = `
      <div class="eyebrow">Scheduling</div>
      <h1>Invalid link</h1>
      <p class="sub">This scheduling link is invalid or has expired. Please contact your tutor for a new one.</p>`;
  }
</script>

</body>
</html>
