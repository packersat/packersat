<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Session — Packer SAT Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1A0508;
      color: #FAFAF8;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
    }
    .card {
      background: #2A0A10;
      border: 1px solid rgba(192,24,43,0.2);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #FAFAF8;
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo span { color: #C8A96E; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .sub {
      color: rgba(250,250,248,0.5);
      font-size: 0.88rem;
      line-height: 1.65;
      margin-bottom: 1.8rem;
    }
    .slot-card {
      border: 1px solid rgba(192,24,43,0.4);
      border-radius: 8px;
      padding: 1.2rem 1.4rem;
      background: rgba(192,24,43,0.08);
      margin-bottom: 1.5rem;
    }
    .slot-day {
      font-size: 1.05rem;
      font-weight: 600;
      color: #FAFAF8;
      margin-bottom: 0.25rem;
    }
    .slot-time {
      font-size: 1rem;
      color: #C8A96E;
      font-weight: 500;
    }
    .slot-location {
      font-size: 0.8rem;
      color: rgba(250,250,248,0.4);
      margin-top: 0.4rem;
    }
    .btn-confirm {
      width: 100%;
      background: #C0182B;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.9rem 1.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 0.8rem;
    }
    .btn-confirm:hover { background: #a01224; }
    .btn-confirm:disabled { background: rgba(192,24,43,0.35); cursor: default; }
    .status {
      text-align: center;
      font-size: 0.85rem;
      line-height: 1.6;
      min-height: 1.4rem;
      color: rgba(250,250,248,0.5);
    }
    .status.error { color: #ff8a8a; }
    .status.success { color: #7dffaa; }
    .success-wrap {
      text-align: center;
      padding: 1rem 0;
    }
    .success-icon {
      width: 52px;
      height: 52px;
      background: rgba(192,24,43,0.15);
      border: 1px solid rgba(192,24,43,0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem;
    }
    .cal-link {
      display: inline-block;
      margin-top: 1rem;
      background: rgba(200,169,110,0.1);
      border: 1px solid rgba(200,169,110,0.3);
      color: #C8A96E;
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .cal-link:hover { background: rgba(200,169,110,0.18); }
    .loading { text-align: center; color: rgba(250,250,248,0.4); font-size: 0.9rem; padding: 2rem; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">Packer <span>SAT</span> Prep</div>
  <div id="main-content">
    <div class="loading">Loading your session details...</div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp }        from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import { getFirestore, doc, getDoc, updateDoc, addDoc, collection }
    from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

  const app = initializeApp({
    apiKey:            "AIzaSyAgl3-vGO-FAHSodXvTFtWv7V5_48qW22w",
    authDomain:        "packer-sat.firebaseapp.com",
    projectId:         "packer-sat",
    storageBucket:     "packer-sat.appspot.com",
    messagingSenderId: "783676228684",
    appId:             "1:783676228684:web:97e9e5b5e5e9e5e9e5e9e5",
  });
  const db = getFirestore(app);

  const content = document.getElementById('main-content');

  // ── Parse token from URL ────────────────────────────────────────
  function getToken() {
    const params = new URLSearchParams(window.location.search);
    const t = params.get('t');
    console.log('Raw t param:', t);
    if (!t) { console.log('No t param found'); return null; }
    try {
      // Reverse URL-safe base64: -→+, _→/, restore = padding
      const b64    = t.replace(/-/g, '+').replace(/_/g, '/');
      const padded = b64 + '=='.slice(0, (4 - b64.length % 4) % 4);
      console.log('b64:', b64.slice(0, 40) + '...');
      const parsed = JSON.parse(atob(padded));
      console.log('Parsed token:', parsed);
      return parsed;
    } catch(e) {
      console.error('Token decode failed:', e);
      return null;
    }
  }

  // ── Format helpers ──────────────────────────────────────────────
  function formatDay(date) {
    return new Date(date + 'T12:00:00').toLocaleDateString('en-US',
      { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }
  function formatTime(time) {
    if (!time) return 'TBD';
    const [h, m] = time.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  function buildCalLink(date, time, studentName, location) {
    const [yr, mo, dy] = date.split('-').map(Number);
    const [h, m]       = time.split(':').map(Number);
    const d = new Date(yr, mo - 1, dy);
    const jan = new Date(yr, 0, 1), jul = new Date(yr, 6, 1);
    const isDST = d.getTimezoneOffset() < Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
    const offset = isDST ? 4 : 5;
    const startUTC = new Date(Date.UTC(yr, mo - 1, dy, h + offset, m, 0));
    const endUTC   = new Date(startUTC.getTime() + 3600000);
    const fmt = dt => dt.toISOString().replace(/[-:]/g,'').replace('.000','');
    const title   = encodeURIComponent(`Jack / ${studentName} — SAT Tutoring`);
    const details = encodeURIComponent('SAT tutoring session at Packer Collegiate Institute.');
    const loc     = encodeURIComponent(location || 'Packer Collegiate Institute, Brooklyn, NY');
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${fmt(startUTC)}/${fmt(endUTC)}&details=${details}&location=${loc}`;
  }

  // ── Send confirmation email via Brevo ───────────────────────────
  async function sendConfirmationEmail(studentEmail, studentName, date, time, location, calLink) {
    const dayStr  = formatDay(date);
    const timeStr = formatTime(time);
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#1A0508;font-family:'Helvetica Neue',Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#1A0508;padding:40px 20px">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%">
      <tr><td style="background:linear-gradient(135deg,#6B0F1A,#C0182B);padding:32px 40px;border-radius:8px 8px 0 0;text-align:center">
        <div style="font-family:Georgia,serif;font-size:24px;font-weight:700;color:#FAFAF8">Packer <span style="color:#C8A96E">SAT</span> Prep</div>
        <div style="font-size:11px;color:rgba(250,250,248,0.7);letter-spacing:0.12em;text-transform:uppercase;margin-top:8px">Session Confirmed</div>
      </td></tr>
      <tr><td style="background:#2A0A10;padding:36px 40px;border-left:1px solid rgba(192,24,43,0.2);border-right:1px solid rgba(192,24,43,0.2)">
        <p style="margin:0 0 14px;color:#FAFAF8;font-size:16px;line-height:1.6">Hi <strong>${studentName}</strong>,</p>
        <p style="margin:0 0 24px;color:rgba(250,250,248,0.75);font-size:14px;line-height:1.75">Your tutoring session is confirmed. Here are the details:</p>
        <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:28px">
          <tr><td style="padding:12px 16px;background:rgba(192,24,43,0.08);border-radius:6px 6px 0 0;border-bottom:1px solid rgba(192,24,43,0.15)">
            <div style="font-size:11px;color:rgba(250,250,248,0.4);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px">Date</div>
            <div style="font-size:15px;color:#FAFAF8;font-weight:600">${dayStr}</div>
          </td></tr>
          <tr><td style="padding:12px 16px;background:rgba(192,24,43,0.06);border-bottom:1px solid rgba(192,24,43,0.15)">
            <div style="font-size:11px;color:rgba(250,250,248,0.4);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px">Time</div>
            <div style="font-size:15px;color:#FAFAF8;font-weight:600">${timeStr} Eastern</div>
          </td></tr>
          <tr><td style="padding:12px 16px;background:rgba(192,24,43,0.08);border-radius:0 0 6px 6px">
            <div style="font-size:11px;color:rgba(250,250,248,0.4);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px">Location</div>
            <div style="font-size:15px;color:#FAFAF8;font-weight:600">${location || 'Packer Collegiate Institute'}</div>
          </td></tr>
        </table>
        <table width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
          <a href="${calLink}" style="display:inline-block;background:rgba(200,169,110,0.12);border:1px solid rgba(200,169,110,0.35);color:#C8A96E;text-decoration:none;padding:10px 24px;border-radius:6px;font-size:13px;font-weight:600;font-family:'Helvetica Neue',Arial,sans-serif">
            &#128197; Add to Google Calendar
          </a>
        </td></tr></table>
      </td></tr>
      <tr><td style="background:#1A0508;padding:20px 40px;border-radius:0 0 8px 8px;border:1px solid rgba(192,24,43,0.15);border-top:none;text-align:center">
        <p style="margin:0 0 4px;color:rgba(250,250,248,0.3);font-size:12px">Questions? Reply to this email.</p>
        <p style="margin:0;color:rgba(250,250,248,0.2);font-size:11px">Packer SAT Tutoring &middot; packersat.org</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>`;

    await fetch('https://packersat.vercel.app/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        to_email: studentEmail,
        to_name:  studentName,
        subject:  `Session confirmed: ${dayStr} at ${timeStr}`,
        html_content: html,
        from_email: 'jack@packersat.org',
        from_name:  'Jack Rose',
        reply_to:   'jack@packersat.org',
      }),
    });
  }

  // ── Main ────────────────────────────────────────────────────────
  const token = getToken();
  console.log('Token result:', token);
  console.log('Has pickerId:', token?.pickerId);
  console.log('Has studentId:', token?.studentId);
  console.log('Has date:', token?.date);
  console.log('Has time:', token?.time);

  if (!token || !token.pickerId || !token.date || !token.time) {
    content.innerHTML = `
      <h1 style="margin-bottom:0.5rem">Invalid link</h1>
      <p class="sub">This scheduling link is invalid or has expired. Please contact your tutor for a new one.</p>`;
  } else {
    const { pickerId, studentId, date, time, location } = token;
    const dayStr  = formatDay(date);
    const timeStr = formatTime(time);

    // Show the confirmation UI
    content.innerHTML = `
      <h1>Confirm your session</h1>
      <p class="sub">You're selecting the following time for your SAT tutoring session:</p>
      <div class="slot-card">
        <div class="slot-day">${dayStr}</div>
        <div class="slot-time">${timeStr} Eastern</div>
        <div class="slot-location">&#128205; ${location || 'Packer Collegiate Institute'}</div>
      </div>
      <button class="btn-confirm" id="confirm-btn" onclick="confirmSession()">Confirm this time</button>
      <div class="status" id="status-msg"></div>`;

    window.confirmSession = async function() {
      const btn    = document.getElementById('confirm-btn');
      const status = document.getElementById('status-msg');
      btn.disabled = true;
      btn.textContent = 'Confirming...';
      status.textContent = '';
      status.className = 'status';

      try {
        // Get picker doc to find admin/tutor info
        const pickerDoc = await getDoc(doc(db, 'schedulePickers', pickerId));
        if (!pickerDoc.exists()) throw new Error('Picker not found');
        const picker = pickerDoc.data();

        // Resolve student info — may be a portal user or a custom email
        let studentName  = token.studentName  || picker.studentName  || 'Student';
        let studentEmail = token.studentEmail || picker.studentEmail || '';
        let resolvedStudentId = studentId || null;
        let tutorId      = picker.adminId || null;

        if (studentId) {
          const studentDoc = await getDoc(doc(db, 'users', studentId));
          if (studentDoc.exists()) {
            const s = studentDoc.data();
            studentName  = s.name  || s.email || studentName;
            studentEmail = s.email || studentEmail;
            tutorId      = s.tutorId || picker.adminId || null;
            resolvedStudentId = studentId;
          }
        }

        console.log('Sending confirmation to:', studentEmail, studentName);

        // Write session to Firestore
        await addDoc(collection(db, 'sessions'), {
          studentId:  resolvedStudentId,
          tutorId,
          date,
          time,
          location: location || 'Packer Collegiate Institute',
          createdAt: new Date().toISOString(),
          confirmedByStudent: true,
          pickerId,
        });

        // Mark picker slot as used (but don't disable other slots)
        if (pickerId && token.idx !== undefined) {
          await updateDoc(doc(db, 'schedulePickers', pickerId), {
            [`slotUsed_${token.idx}`]: true,
          });
        }

        // Build calendar link
        const calLink = buildCalLink(date, time, studentName, location);

        // Send confirmation email — don't let email failure block the success screen
        if (studentEmail) {
          try {
            await sendConfirmationEmail(studentEmail, studentName, date, time, location, calLink);
            console.log('Confirmation email sent to:', studentEmail);
          } catch(emailErr) {
            console.error('Confirmation email failed (non-critical):', emailErr);
          }
        } else {
          console.warn('No student email found — skipping confirmation email');
        }

        // Show success
        content.innerHTML = `
          <div class="success-wrap">
            <div class="success-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C0182B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h1 style="margin-bottom:0.5rem">You're all set!</h1>
            <p class="sub">Your session on <strong style="color:#FAFAF8">${dayStr}</strong> at <strong style="color:#C8A96E">${timeStr} Eastern</strong> is confirmed.${studentEmail ? ' A confirmation email with your calendar invite has been sent.' : ''}</p>
            <a href="${calLink}" target="_blank" class="cal-link">&#128197; Add to Google Calendar</a>
          </div>`;

      } catch(e) {
        console.error('Confirmation error:', e);
        btn.disabled = false;
        btn.textContent = 'Confirm this time';
        status.textContent = 'Something went wrong: ' + (e?.message || String(e));
        status.className = 'status error';
      }
    };
  }
</script>
</body>
</html>
